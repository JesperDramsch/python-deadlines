name: Canonical Source Update

on:
  # Triggered by IFTTT/changedetection webhooks when canonical sources update
  repository_dispatch:
    types: [canonical-source-update]

  # Daily as well, so an update still lands when the webhooks stay quiet
  schedule:
    - cron: '37 5 * * *'

  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      source:
        description: 'Source to update from'
        required: true
        type: choice
        options:
          - all
          - ics
          - csv
        default: all
      dry_run:
        description: 'Dry run (no commit/PR)'
        required: false
        type: boolean
        default: false

# One group with enrich-tba-conferences.yml: both write to the accumulator
# branch, so their runs queue behind each other instead of racing. A group
# keeps one pending run, which a newer run of either workflow replaces: the
# enrich run this workflow starts at its end can replace a pending canonical
# run, and a later canonical run can replace a pending enrich run. Both daily
# crons limit the loss.
concurrency:
  group: auto-conference-updates
  cancel-in-progress: false

permissions:
  # actions: write lets the job start the TBA enrichment run
  actions: write
  contents: write
  pull-requests: write

env:
  UPDATE_BRANCH: auto/conference-updates

jobs:
  update-from-canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Parse trigger source
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_SOURCE: ${{ github.event.client_payload.source }}
          INPUT_SOURCE: ${{ inputs.source }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            # Webhook trigger - get source from payload
            SOURCE="${PAYLOAD_SOURCE:-all}"
            echo "Triggered by webhook for source: $SOURCE"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            SOURCE="all"
            echo "Scheduled run for source: $SOURCE"
          else
            # Manual trigger
            SOURCE="${INPUT_SOURCE:-all}"
            echo "Manual trigger for source: $SOURCE"
          fi

          # Validate source
          case "$SOURCE" in
            all|ics|csv)
              echo "source=$SOURCE" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "::warning title=Unknown Source::Unknown source '$SOURCE', defaulting to 'all'"
              echo "source=all" >> $GITHUB_OUTPUT
              ;;
          esac

          echo "## Trigger Info" >> $GITHUB_STEP_SUMMARY
          echo "- **Event:** $EVENT_NAME" >> $GITHUB_STEP_SUMMARY
          echo "- **Source:** $SOURCE" >> $GITHUB_STEP_SUMMARY

      # Before the branch setup, which runs utils/merge_data.py on a conflict
      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.11.2

      - name: Setup accumulator branch
        id: setup
        run: |
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

          if git ls-remote --heads origin "$UPDATE_BRANCH" | grep -q "$UPDATE_BRANCH"; then
            echo "::notice title=Branch::Checking out existing accumulator branch"
            git fetch origin "$UPDATE_BRANCH"
            git checkout "$UPDATE_BRANCH"
            echo "existed=true" >> "$GITHUB_OUTPUT"
            echo "tip=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            # Sync with main by merging, never rebasing: the desk pushes to this
            # branch too, and a rebase would rewrite its commits. Once both
            # sides have sorted the data, git conflicts in _data even where no
            # field changed on both sides, so merge_data.py merges the entries
            # field by field. Any other conflict, or a field both sides
            # changed, fails the job: resolving it in favour of main would
            # silently drop the changes already on this branch.
            if ! { git merge origin/main --no-edit || { pixi run python utils/merge_data.py && git commit --no-edit; }; }; then
              CONFLICTS=$(git diff --name-only --diff-filter=U | paste -sd ' ' -)
              git merge --abort 2>/dev/null || true
              echo "::error title=Branch Sync Conflict::${CONFLICTS:-git merge origin/main failed with no conflicted files}"
              exit 1
            fi
          else
            echo "::notice title=Branch::Creating new accumulator branch"
            git checkout -b "$UPDATE_BRANCH"
            echo "existed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Snapshot data files
        run: |
          cp _data/conferences.yml /tmp/conferences_before.yml
          cp _data/archive.yml /tmp/archive_before.yml 2>/dev/null || true
          cp _data/legacy.yml /tmp/legacy_before.yml 2>/dev/null || true

      - name: Run merge scripts
        id: merge
        env:
          SOURCE: ${{ steps.source.outputs.source }}
          # Questions the merge would ask a person are answered with their
          # default here and written to this file for the desk to check.
          DESK_QUEUE_OUT: ${{ runner.temp }}/desk-records.jsonl
        run: |
          echo "::group::Running merge for source: $SOURCE"

          case "$SOURCE" in
            ics)
              echo "Importing from Python official calendar (ICS)..."
              pixi run python ./utils/import_python_official.py
              pixi run sort
              ;;
            csv)
              echo "Importing from Python organizers (CSV)..."
              pixi run python ./utils/import_python_organizers.py
              pixi run sort
              ;;
            all)
              echo "Running full merge pipeline..."
              pixi run merge
              ;;
          esac

          echo "::endgroup::"

          # Capture which source was processed for commit message
          echo "source_label=$SOURCE" >> $GITHUB_OUTPUT

      # A queue problem must not hold back the data merge.
      - name: Queue the merge's open questions for the desk
        if: inputs.dry_run != true
        continue-on-error: true
        uses: ./.github/actions/desk-queue-write
        with:
          records: ${{ runner.temp }}/desk-records.jsonl
          message: "Queue merge questions from canonical source ${{ steps.source.outputs.source }}"

      - name: Verify no conference data loss
        run: |
          # An automated merge must never delete or rename existing conferences.
          # This blocks e.g. two distinct conferences being fuzzy-matched into one
          # (PyCon Africa vs PyCon South Africa) before anything is committed.
          pixi run python ./utils/check_data_loss.py \
            --before /tmp/conferences_before.yml /tmp/archive_before.yml /tmp/legacy_before.yml \
            --after _data/conferences.yml _data/archive.yml _data/legacy.yml

      - name: Check for changes
        id: check_changes
        run: |
          # Check if any data files changed
          CHANGED=false

          if ! diff -q _data/conferences.yml /tmp/conferences_before.yml > /dev/null 2>&1; then
            echo "conferences.yml has changes"
            CHANGED=true
          fi

          if [ -f /tmp/archive_before.yml ] && ! diff -q _data/archive.yml /tmp/archive_before.yml > /dev/null 2>&1; then
            echo "archive.yml has changes"
            CHANGED=true
          fi

          echo "changed=$CHANGED" >> $GITHUB_OUTPUT

          if [ "$CHANGED" = "true" ]; then
            echo "::notice title=Changes Detected::Data files were updated"

            # Show summary of changes
            echo "## Changes" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`diff" >> $GITHUB_STEP_SUMMARY
            diff -u /tmp/conferences_before.yml _data/conferences.yml | head -50 >> $GITHUB_STEP_SUMMARY || true
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "::notice title=No Changes::Data files are up to date"
            echo "## No Changes" >> $GITHUB_STEP_SUMMARY
            echo "Canonical sources did not have any new data." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit and push
        if: steps.check_changes.outputs.changed == 'true' && inputs.dry_run != true
        id: commit
        env:
          SOURCE: ${{ steps.source.outputs.source }}
          BRANCH_EXISTED: ${{ steps.setup.outputs.existed }}
          SETUP_TIP: ${{ steps.setup.outputs.tip }}
        run: |
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

          # Stage data files
          git add _data/conferences.yml _data/archive.yml _data/legacy.yml 2>/dev/null || git add _data/conferences.yml

          # Create descriptive commit message based on source
          case "$SOURCE" in
            ics)
              COMMIT_MSG="conf: data merge from PSF calendar"
              ;;
            csv)
              COMMIT_MSG="conf: data merge from python-organizers"
              ;;
            all)
              COMMIT_MSG="conf: data merge"
              ;;
          esac

          git commit -m "$COMMIT_MSG" -m "Source: canonical-$SOURCE" -m "Triggered: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # The PR row links this commit, not a merge the retries below may add
          COMMIT_SHA=$(git rev-parse HEAD)

          # The merge can change utils/tidy_conf/data/titles.yml and
          # rejections.yml, which this job does not stage. A retry merge below
          # refuses to run when the fetched branch changed them too, so drop
          # every unstaged change to a tracked file now the data is committed.
          git checkout -- .

          # Merging the rolling PR deletes this branch, and a push after that
          # would recreate it from this run's old history. Stop instead when
          # the branch existed at setup and is now gone, or no longer holds the
          # commit this run started from. The next run starts fresh from main.
          stop_if_rolling_pr_merged() {
            [ "$BRANCH_EXISTED" = "true" ] || return 0
            REMOTE_STATUS=0
            REMOTE=$(git ls-remote --exit-code origin "refs/heads/$UPDATE_BRANCH") || REMOTE_STATUS=$?
            if [ "$REMOTE_STATUS" = 2 ]; then
              echo "::error title=Rolling PR Merged::$UPDATE_BRANCH was deleted on origin after this run started: the rolling PR was merged or closed. Not recreating it from old history: the next run starts fresh from main."
              exit 1
            fi
            REMOTE_TIP=${REMOTE%%[[:space:]]*}
            if [ "$REMOTE_STATUS" = 0 ] && git cat-file -e "$REMOTE_TIP^{commit}" 2>/dev/null \
              && ! git merge-base --is-ancestor "$SETUP_TIP" "$REMOTE_TIP"; then
              echo "::error title=Rolling PR Merged::$UPDATE_BRANCH on origin no longer holds the commit this run started from: the rolling PR was merged or closed and the branch started again. Not pushing old history to it: the next run starts fresh from main."
              exit 1
            fi
          }

          # The desk pushes to this branch too. A rejected push fetches the
          # branch, merges it (data conflicts through merge_data.py) and tries
          # again, up to five times. Never force.
          PUSHED=false
          for ATTEMPT in 1 2 3 4 5; do
            stop_if_rolling_pr_merged
            if git push origin "HEAD:$UPDATE_BRANCH"; then
              PUSHED=true
              break
            fi
            echo "::warning title=Push Rejected::Push $ATTEMPT of 5 to $UPDATE_BRANCH failed"
            if [ "$ATTEMPT" = 5 ]; then
              break
            fi
            if ! git fetch origin "$UPDATE_BRANCH"; then
              sleep $((ATTEMPT * 10))
              continue
            fi
            stop_if_rolling_pr_merged
            if ! { git merge "origin/$UPDATE_BRANCH" --no-edit || { pixi run python utils/merge_data.py && git commit --no-edit; }; }; then
              CONFLICTS=$(git diff --name-only --diff-filter=U | paste -sd ' ' -)
              git merge --abort 2>/dev/null || true
              echo "::error title=Push Merge Conflict::${CONFLICTS:-git merge origin/$UPDATE_BRANCH failed with no conflicted files}"
              exit 1
            fi
          done

          if [ "$PUSHED" != "true" ]; then
            echo "::error title=Push Failed::Could not push to $UPDATE_BRANCH after 5 attempts"
            exit 1
          fi

          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "commit_msg=$COMMIT_MSG" >> "$GITHUB_OUTPUT"

      # The rolling PR body has one block per writer (utils/desk_pr_body.py).
      # This job owns COMMITTED:canonical and adds one line per commit there,
      # naming the editions the commit changed. A commit that changed none,
      # such as a re-quote or the sort moving entries between files, adds no
      # line. The script comes from the commit this run started on: the
      # accumulator branch checked out here may not have it yet.
      - name: Create or update PR
        if: steps.check_changes.outputs.changed == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE: ${{ steps.source.outputs.source }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
        run: |
          SCRIPT="$RUNNER_TEMP/desk_pr_body.py"
          git show "$GITHUB_SHA:utils/desk_pr_body.py" > "$SCRIPT"
          case "$SOURCE" in
            ics) LABEL="📊 PSF Calendar" ;;
            csv) LABEL="📊 python-organizers" ;;
            *) LABEL="📊 Canonical sources" ;;
          esac

          PR=$(gh api "repos/$REPO/pulls?head=${REPO%%/*}:$UPDATE_BRANCH&state=open" --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            pixi run python "$SCRIPT" skeleton > "$RUNNER_TEMP/body.md"
            PR=$(gh api "repos/$REPO/pulls" -f title='🐍 Conference updates' -f head="$UPDATE_BRANCH" -f base=main \
              -F body=@"$RUNNER_TEMP/body.md" --jq .number)
            gh api "repos/$REPO/issues/$PR/labels" -f 'labels[]=automated' -f 'labels[]=conference-update' --silent
            echo "::notice title=PR Created::Opened #$PR for the canonical source merge"
          fi

          pixi run python "$SCRIPT" --repo "$REPO" commit-line --sha "$COMMIT_SHA" --label "$LABEL" > "$RUNNER_TEMP/line.md"
          if [ -s "$RUNNER_TEMP/line.md" ]; then
            pixi run python "$SCRIPT" --repo "$REPO" --pr "$PR" append COMMITTED:canonical "$RUNNER_TEMP/line.md"
          else
            echo "::notice title=No Edition Changed::$COMMIT_SHA changed no edition, so #$PR gets no line for it"
          fi

      - name: Trigger TBA enrichment
        if: steps.check_changes.outputs.changed == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::notice title=Triggering TBA Enrichment::Starting TBA conference enrichment workflow"
          gh workflow run enrich-tba-conferences.yml || {
            echo "::warning title=Trigger Failed::Could not trigger TBA enrichment workflow"
          }

      - name: Summary
        if: always()
        env:
          SOURCE: ${{ steps.source.outputs.source }}
          CHANGED: ${{ steps.check_changes.outputs.changed }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Result" >> $GITHUB_STEP_SUMMARY

          if [ "$CHANGED" = "true" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "- Status: Changes detected (dry run - not committed)" >> $GITHUB_STEP_SUMMARY
            else
              echo "- Status: ✅ Changes committed and PR updated" >> $GITHUB_STEP_SUMMARY
              echo "- TBA Enrichment: Triggered" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- Status: ✓ No new data from canonical sources" >> $GITHUB_STEP_SUMMARY
          fi

          echo "- Source: $SOURCE" >> $GITHUB_STEP_SUMMARY
