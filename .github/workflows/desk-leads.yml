name: Desk Leads

# Report-only. Looks for leads on pretalx, developers.events and the PyCon
# registries and queues them for the desk, which checks each one on the
# conference's own pages. Nothing here writes the conference data.
#
# Daily, pretalx: deadline drift on upcoming entries, and the next edition's
# CfP page guessed from the latest slug. Only /<slug>/cfp pages are read;
# robots.txt on pretalx.com disallows /api/.
# Weekly, developers.events (CC BY-NC data, used for leads only) and the
# pycon.org registry.
# On change, the PSF PyCon trademark list: a changedetection.io watch on the
# page sends a registry-change dispatch, and the whole list is read again.
#
# A finding the desk has handled is not queued again until it changes, so a
# lead that comes back every run adds nothing.

on:
  schedule:
    - cron: '23 4 * * *'  # daily 04:23 UTC: pretalx
    - cron: '41 4 * * 0'  # Sundays 04:41 UTC: developers-events and pycon.org
  repository_dispatch:
    types: [registry-change]  # the trademark list changed
  workflow_dispatch:
    inputs:
      sources:
        description: Sources to run
        type: choice
        options:
          - all
          - pretalx
          - developers-events
          - registry
          - psf-trademarks
          - pycon-org
        default: all

concurrency:
  group: desk-leads
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  leads:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.11.2

      - name: Choose sources
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          CHOSEN: ${{ inputs.sources }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE" in
              '23 4 * * *') SELECTED="pretalx" ;;
              '41 4 * * 0') SELECTED="developers-events pycon-org" ;;
              *) echo "::error title=Desk leads::Unknown schedule $SCHEDULE"; exit 1 ;;
            esac
          elif [ "$EVENT_NAME" = "repository_dispatch" ]; then
            SELECTED="psf-trademarks"
          elif [ "${CHOSEN:-all}" = "all" ]; then
            SELECTED="pretalx developers-events psf-trademarks pycon-org"
          elif [ "$CHOSEN" = "registry" ]; then
            SELECTED="psf-trademarks pycon-org"
          else
            SELECTED="$CHOSEN"
          fi
          echo "Sources: $SELECTED"
          for source in pretalx developers-events; do
            case " $SELECTED " in
              *" $source "*) RUN=true ;;
              *) RUN=false ;;
            esac
            echo "${source//-/_}=$RUN" >> "$GITHUB_OUTPUT"
          done
          # The registries run in one step, each on its own
          REGISTRIES=""
          for registry in psf-trademarks pycon-org; do
            case " $SELECTED " in
              *" $registry "*) REGISTRIES="$REGISTRIES $registry" ;;
            esac
          done
          echo "registries=${REGISTRIES# }" >> "$GITHUB_OUTPUT"

      # A source that fails gets a warning; the other sources still run.
      - name: pretalx
        id: pretalx
        if: steps.plan.outputs.pretalx == 'true'
        run: |
          set -uo pipefail
          touch "$RUNNER_TEMP/desk-records.jsonl"
          BEFORE=$(wc -l < "$RUNNER_TEMP/desk-records.jsonl")
          STATUS=ok
          if ! pixi run python utils/desk_leads.py pretalx --out "$RUNNER_TEMP/desk-records.jsonl"; then
            STATUS=failed
            echo "::warning title=Desk leads::pretalx failed; what it found is still queued"
          fi
          AFTER=$(wc -l < "$RUNNER_TEMP/desk-records.jsonl")
          echo "count=$((AFTER - BEFORE))" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: developers.events
        id: developers_events
        if: steps.plan.outputs.developers_events == 'true'
        run: |
          set -uo pipefail
          touch "$RUNNER_TEMP/desk-records.jsonl"
          BEFORE=$(wc -l < "$RUNNER_TEMP/desk-records.jsonl")
          STATUS=ok
          if ! pixi run python utils/desk_leads.py developers-events --out "$RUNNER_TEMP/desk-records.jsonl"; then
            STATUS=failed
            echo "::warning title=Desk leads::developers-events failed; what it found is still queued"
          fi
          AFTER=$(wc -l < "$RUNNER_TEMP/desk-records.jsonl")
          echo "count=$((AFTER - BEFORE))" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: PyCon registries
        id: registry
        if: steps.plan.outputs.registries != ''
        env:
          REGISTRIES: ${{ steps.plan.outputs.registries }}
        run: |
          set -uo pipefail
          touch "$RUNNER_TEMP/desk-records.jsonl"
          BEFORE=$(wc -l < "$RUNNER_TEMP/desk-records.jsonl")
          STATUS=ok
          for registry in $REGISTRIES; do
            if ! pixi run python utils/desk_leads.py "$registry" --out "$RUNNER_TEMP/desk-records.jsonl"; then
              STATUS=failed
              echo "::warning title=Desk leads::$registry failed; what it found is still queued"
            fi
          done
          AFTER=$(wc -l < "$RUNNER_TEMP/desk-records.jsonl")
          echo "count=$((AFTER - BEFORE))" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      # Leads found before a failure are still worth queueing.
      - name: Write to the desk queue
        id: queue
        if: ${{ !cancelled() }}
        uses: ./.github/actions/desk-queue-write
        with:
          records: ${{ runner.temp }}/desk-records.jsonl
          message: Queue leads from pretalx, developers.events and the PyCon registries

      - name: Summary
        if: ${{ !cancelled() }}
        env:
          PRETALX_COUNT: ${{ steps.pretalx.outputs.count }}
          PRETALX_STATUS: ${{ steps.pretalx.outputs.status }}
          DEVELOPERS_EVENTS_COUNT: ${{ steps.developers_events.outputs.count }}
          DEVELOPERS_EVENTS_STATUS: ${{ steps.developers_events.outputs.status }}
          REGISTRY_COUNT: ${{ steps.registry.outputs.count }}
          REGISTRY_STATUS: ${{ steps.registry.outputs.status }}
          ADDED: ${{ steps.queue.outputs.added }}
        run: |
          row() {
            if [ -z "$3" ]; then
              echo "| $1 | not run | |"
            else
              echo "| $1 | $3 | ${2:-0} |"
            fi
          }
          {
            echo "## Desk leads"
            echo ""
            echo "| source | result | records |"
            echo "| --- | --- | --- |"
            row pretalx "$PRETALX_COUNT" "$PRETALX_STATUS"
            row developers-events "$DEVELOPERS_EVENTS_COUNT" "$DEVELOPERS_EVENTS_STATUS"
            row registry "$REGISTRY_COUNT" "$REGISTRY_STATUS"
            echo ""
            echo "- New in the desk queue: ${ADDED:-0}"
          } >> "$GITHUB_STEP_SUMMARY"

      # After the queue write, so a source that failed still turns the run red.
      - name: Fail when a source failed
        if: ${{ !cancelled() }}
        env:
          STATUSES: ${{ steps.pretalx.outputs.status }} ${{ steps.developers_events.outputs.status }} ${{ steps.registry.outputs.status }}
        run: |
          case " $STATUSES " in
            *" failed "*) echo "::error title=Desk leads::a source failed, see the warnings above"; exit 1 ;;
          esac
