name: Desk Leads

# Report-only. Looks for leads on pretalx, developers.events and the pycon.org
# registry and queues them for the desk, which checks each one on the
# conference's own pages. Nothing here writes the conference data.
#
# Sources run when changedetection.io sees them change, with a slow schedule
# as a fallback for a change a watch missed:
#
# - pretalx: deadline drift on upcoming entries, and the next edition's CfP
#   page guessed from the latest slug. Only /<slug>/cfp pages are read;
#   robots.txt on pretalx.com disallows /api/. A watch on one CfP page sends
#   pretalx-change with that page's URL, and only its entries are checked.
#   Weekly, all of them and the next-edition guess.
# - developers.events (CC BY-NC data, used for leads only) and the pycon.org
#   registry: a watch on each (the Python rows of TAGS.csv, the registry's
#   latest commit) sends registry-change naming its source, and that source
#   is read in full. Monthly, both.
#
# The PSF PyCon trademark list is a listing page: its watch sends
# listing-change to check-conference-update.yml, which checks each added line.
#
# A finding the desk has handled is not queued again until it changes, so a
# lead that comes back every run adds nothing.

on:
  schedule:
    - cron: '23 4 * * 1'  # Mondays 04:23 UTC: pretalx
    - cron: '41 4 1 * *'  # the 1st of the month, 04:41 UTC: developers-events and pycon-org
  repository_dispatch:
    types: [registry-change, pretalx-change]
  workflow_dispatch:
    inputs:
      sources:
        description: Sources to run
        type: choice
        options:
          - all
          - pretalx
          - developers-events
          - pycon-org
        default: all

concurrency:
  group: desk-leads
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  leads:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.11.2

      - name: Choose sources
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          CHOSEN: ${{ inputs.sources }}
          ACTION: ${{ github.event.action }}
          # From the changedetection notification: checked below, never run as code
          PAYLOAD_SOURCE: ${{ github.event.client_payload.source }}
          PAYLOAD_URL: ${{ github.event.client_payload.url }}
        run: |
          set -euo pipefail
          PAGE=""
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE" in
              '23 4 * * 1') SELECTED="pretalx" ;;
              '41 4 1 * *') SELECTED="developers-events pycon-org" ;;
              *) echo "::error title=Desk leads::Unknown schedule $SCHEDULE"; exit 1 ;;
            esac
          elif [ "$EVENT_NAME" = "repository_dispatch" ] && [ "$ACTION" = "pretalx-change" ]; then
            # A watch URL may hold a year template, which has spaces. A line
            # break could add step outputs, so only that is refused.
            case "$PAYLOAD_URL" in
              *$'\n'*|*$'\r'*) echo "::error title=Desk leads::pretalx-change url holds a line break"; exit 1 ;;
              https://*) SELECTED="pretalx"; PAGE="$PAYLOAD_URL" ;;
              *) echo "::error title=Desk leads::pretalx-change needs an https url"; exit 1 ;;
            esac
          elif [ "$EVENT_NAME" = "repository_dispatch" ]; then
            case "$PAYLOAD_SOURCE" in
              developers-events|pycon-org) SELECTED="$PAYLOAD_SOURCE" ;;
              *) echo "::error title=Desk leads::registry-change names no known source"; exit 1 ;;
            esac
          elif [ "${CHOSEN:-all}" = "all" ]; then
            SELECTED="pretalx developers-events pycon-org"
          else
            SELECTED="$CHOSEN"
          fi
          echo "Sources: $SELECTED"
          for source in pretalx developers-events pycon-org; do
            case " $SELECTED " in
              *" $source "*) RUN=true ;;
              *) RUN=false ;;
            esac
            echo "${source//-/_}=$RUN" >> "$GITHUB_OUTPUT"
          done
          echo "page=$PAGE" >> "$GITHUB_OUTPUT"

      # A source that fails gets a warning; the other sources still run.
      - name: pretalx
        id: pretalx
        if: steps.plan.outputs.pretalx == 'true'
        env:
          PAGE: ${{ steps.plan.outputs.page }}
        run: |
          set -uo pipefail
          touch "$RUNNER_TEMP/desk-records.jsonl"
          BEFORE=$(wc -l < "$RUNNER_TEMP/desk-records.jsonl")
          STATUS=ok
          ARGS=(pretalx --out "$RUNNER_TEMP/desk-records.jsonl")
          if [ -n "$PAGE" ]; then
            ARGS+=(--url "$PAGE")
          fi
          if ! pixi run python utils/desk_leads.py "${ARGS[@]}"; then
            STATUS=failed
            echo "::warning title=Desk leads::pretalx failed; what it found is still queued"
          fi
          AFTER=$(wc -l < "$RUNNER_TEMP/desk-records.jsonl")
          echo "count=$((AFTER - BEFORE))" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: developers.events
        id: developers_events
        if: steps.plan.outputs.developers_events == 'true'
        run: |
          set -uo pipefail
          touch "$RUNNER_TEMP/desk-records.jsonl"
          BEFORE=$(wc -l < "$RUNNER_TEMP/desk-records.jsonl")
          STATUS=ok
          if ! pixi run python utils/desk_leads.py developers-events --out "$RUNNER_TEMP/desk-records.jsonl"; then
            STATUS=failed
            echo "::warning title=Desk leads::developers-events failed; what it found is still queued"
          fi
          AFTER=$(wc -l < "$RUNNER_TEMP/desk-records.jsonl")
          echo "count=$((AFTER - BEFORE))" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: pycon.org
        id: pycon_org
        if: steps.plan.outputs.pycon_org == 'true'
        run: |
          set -uo pipefail
          touch "$RUNNER_TEMP/desk-records.jsonl"
          BEFORE=$(wc -l < "$RUNNER_TEMP/desk-records.jsonl")
          STATUS=ok
          if ! pixi run python utils/desk_leads.py pycon-org --out "$RUNNER_TEMP/desk-records.jsonl"; then
            STATUS=failed
            echo "::warning title=Desk leads::pycon-org failed; what it found is still queued"
          fi
          AFTER=$(wc -l < "$RUNNER_TEMP/desk-records.jsonl")
          echo "count=$((AFTER - BEFORE))" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      # Leads found before a failure are still worth queueing.
      - name: Write to the desk queue
        id: queue
        if: ${{ !cancelled() }}
        uses: ./.github/actions/desk-queue-write
        with:
          records: ${{ runner.temp }}/desk-records.jsonl
          message: Queue leads from pretalx, developers.events and pycon.org

      - name: Summary
        if: ${{ !cancelled() }}
        env:
          PRETALX_COUNT: ${{ steps.pretalx.outputs.count }}
          PRETALX_STATUS: ${{ steps.pretalx.outputs.status }}
          DEVELOPERS_EVENTS_COUNT: ${{ steps.developers_events.outputs.count }}
          DEVELOPERS_EVENTS_STATUS: ${{ steps.developers_events.outputs.status }}
          PYCON_ORG_COUNT: ${{ steps.pycon_org.outputs.count }}
          PYCON_ORG_STATUS: ${{ steps.pycon_org.outputs.status }}
          ADDED: ${{ steps.queue.outputs.added }}
        run: |
          row() {
            if [ -z "$3" ]; then
              echo "| $1 | not run | |"
            else
              echo "| $1 | $3 | ${2:-0} |"
            fi
          }
          {
            echo "## Desk leads"
            echo ""
            echo "| source | result | records |"
            echo "| --- | --- | --- |"
            row pretalx "$PRETALX_COUNT" "$PRETALX_STATUS"
            row developers-events "$DEVELOPERS_EVENTS_COUNT" "$DEVELOPERS_EVENTS_STATUS"
            row pycon-org "$PYCON_ORG_COUNT" "$PYCON_ORG_STATUS"
            echo ""
            echo "- New in the desk queue: ${ADDED:-0}"
          } >> "$GITHUB_STEP_SUMMARY"

      # After the queue write, so a source that failed still turns the run red.
      - name: Fail when a source failed
        if: ${{ !cancelled() }}
        env:
          STATUSES: ${{ steps.pretalx.outputs.status }} ${{ steps.developers_events.outputs.status }} ${{ steps.pycon_org.outputs.status }}
        run: |
          case " $STATUSES " in
            *" failed "*) echo "::error title=Desk leads::a source failed, see the warnings above"; exit 1 ;;
          esac
