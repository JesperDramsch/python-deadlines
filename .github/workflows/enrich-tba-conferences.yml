name: Enrich TBA Conferences

on:
  # Manual trigger or called by canonical-source-update
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no commit/PR)'
        required: false
        type: boolean
        default: false

  # Daily run
  schedule:
    - cron: '0 6 * * *'  # Daily 6 AM UTC

# One group with canonical-source-update.yml: both write to the accumulator
# branch, so their runs queue behind each other instead of racing.
concurrency:
  group: auto-conference-updates
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  UPDATE_BRANCH: auto/conference-updates

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Before the branch setup, which runs utils/merge_data.py on a conflict
      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.10.2

      - name: Setup accumulator branch
        id: setup
        run: |
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

          if git ls-remote --heads origin "$UPDATE_BRANCH" | grep -q "$UPDATE_BRANCH"; then
            echo "::notice title=Branch::Checking out existing accumulator branch"
            git fetch origin "$UPDATE_BRANCH"
            git checkout "$UPDATE_BRANCH"
            echo "existed=true" >> "$GITHUB_OUTPUT"
            echo "tip=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            # Sync with main by merging, never rebasing: the desk pushes to this
            # branch too, and a rebase would rewrite its commits. Once both
            # sides have sorted the data, git conflicts in _data even where no
            # field changed on both sides, so merge_data.py merges the entries
            # field by field. Any other conflict, or a field both sides
            # changed, fails the job: resolving it in favour of main would
            # silently drop the changes already on this branch.
            if ! { git merge origin/main --no-edit || { pixi run python utils/merge_data.py && git commit --no-edit; }; }; then
              CONFLICTS=$(git diff --name-only --diff-filter=U | paste -sd ' ' -)
              git merge --abort 2>/dev/null || true
              echo "::error title=Branch Sync Conflict::${CONFLICTS:-git merge origin/main failed with no conflicted files}"
              exit 1
            fi
          else
            echo "::notice title=Branch::Creating new accumulator branch"
            git checkout -b "$UPDATE_BRANCH"
            echo "existed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Snapshot data files
        run: |
          cp _data/conferences.yml /tmp/conferences_before.yml

      - name: Install lynx for link extraction
        run: sudo apt-get install -qq -y lynx > /dev/null 2>&1 || true

      - name: Find TBA conferences
        id: find-tba
        run: |
          # Count TBA conferences
          TBA_COUNT=$(python3 << 'PYCOUNT'
          import yaml

          tba_words = ["tba", "tbd", "cancelled", "none", "na", "n/a", "nan", "n.a."]
          with open("_data/conferences.yml") as f:
              conferences = yaml.safe_load(f) or []

          count = sum(1 for c in conferences if str(c.get("cfp", "")).lower().strip() in tba_words)
          print(count)
          PYCOUNT
          )

          echo "tba_count=$TBA_COUNT" >> $GITHUB_OUTPUT

          if [ "$TBA_COUNT" = "0" ]; then
            echo "::notice title=No TBA::No conferences with TBA CFP found"
          else
            echo "::notice title=TBA Found::Found $TBA_COUNT conferences with TBA CFP"
          fi

          echo "## TBA Conferences" >> $GITHUB_STEP_SUMMARY
          echo "Found **$TBA_COUNT** conferences with TBA CFP deadlines" >> $GITHUB_STEP_SUMMARY

      - name: Enrich TBA conferences
        id: enrich
        if: steps.find-tba.outputs.tba_count != '0'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo "::group::Running enrichment"

          # Build command
          CMD="pixi run python utils/enrich_tba.py"
          if [ "$DRY_RUN" = "true" ]; then
            CMD="$CMD --dry-run"
          fi

          # Run enrichment
          if $CMD; then
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
            echo "::error title=Enrichment Failed::TBA enrichment script failed"
            echo "::endgroup::"
            exit 1
          fi

          echo "::endgroup::"

      - name: Check for changes
        id: check_changes
        run: |
          if ! diff -q _data/conferences.yml /tmp/conferences_before.yml > /dev/null 2>&1; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "::notice title=Changes Detected::Conference data was updated"

            # Show summary of changes
            echo "## Changes" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`diff" >> $GITHUB_STEP_SUMMARY
            diff -u /tmp/conferences_before.yml _data/conferences.yml | head -100 >> $GITHUB_STEP_SUMMARY || true
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "::notice title=No Changes::No updates from TBA enrichment"
            echo "## No Changes" >> $GITHUB_STEP_SUMMARY
            echo "TBA enrichment did not find any new links to add." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Validate and sort
        if: steps.check_changes.outputs.changed == 'true' && inputs.dry_run != true
        run: pixi run sort

      - name: Commit and push
        if: steps.check_changes.outputs.changed == 'true' && inputs.dry_run != true
        id: commit
        env:
          BRANCH_EXISTED: ${{ steps.setup.outputs.existed }}
          SETUP_TIP: ${{ steps.setup.outputs.tip }}
        run: |
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

          # Stage data files
          git add _data/conferences.yml _data/archive.yml _data/legacy.yml 2>/dev/null || git add _data/conferences.yml

          # Create descriptive commit message
          COMMIT_MSG="chore: enrich TBA conferences with links"

          git commit -m "$COMMIT_MSG" -m "Triggered: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # The PR row links this commit, not a merge the retries below may add
          COMMIT_SHA=$(git rev-parse HEAD)

          # Merging the rolling PR deletes this branch, and a push after that
          # would recreate it from this run's old history. Stop instead when
          # the branch existed at setup and is now gone, or no longer holds the
          # commit this run started from. The next run starts fresh from main.
          stop_if_rolling_pr_merged() {
            [ "$BRANCH_EXISTED" = "true" ] || return 0
            REMOTE_STATUS=0
            REMOTE=$(git ls-remote --exit-code origin "refs/heads/$UPDATE_BRANCH") || REMOTE_STATUS=$?
            if [ "$REMOTE_STATUS" = 2 ]; then
              echo "::error title=Rolling PR Merged::$UPDATE_BRANCH was deleted on origin after this run started: the rolling PR was merged or closed. Not recreating it from old history: the next run starts fresh from main."
              exit 1
            fi
            REMOTE_TIP=${REMOTE%%[[:space:]]*}
            if [ "$REMOTE_STATUS" = 0 ] && git cat-file -e "$REMOTE_TIP^{commit}" 2>/dev/null \
              && ! git merge-base --is-ancestor "$SETUP_TIP" "$REMOTE_TIP"; then
              echo "::error title=Rolling PR Merged::$UPDATE_BRANCH on origin no longer holds the commit this run started from: the rolling PR was merged or closed and the branch started again. Not pushing old history to it: the next run starts fresh from main."
              exit 1
            fi
          }

          # The desk pushes to this branch too. A rejected push fetches the
          # branch, merges it (data conflicts through merge_data.py) and tries
          # again, up to five times. Never force.
          PUSHED=false
          for ATTEMPT in 1 2 3 4 5; do
            stop_if_rolling_pr_merged
            if git push origin "HEAD:$UPDATE_BRANCH"; then
              PUSHED=true
              break
            fi
            echo "::warning title=Push Rejected::Push $ATTEMPT of 5 to $UPDATE_BRANCH failed"
            if [ "$ATTEMPT" = 5 ]; then
              break
            fi
            if ! git fetch origin "$UPDATE_BRANCH"; then
              sleep $((ATTEMPT * 10))
              continue
            fi
            stop_if_rolling_pr_merged
            if ! { git merge "origin/$UPDATE_BRANCH" --no-edit || { pixi run python utils/merge_data.py && git commit --no-edit; }; }; then
              CONFLICTS=$(git diff --name-only --diff-filter=U | paste -sd ' ' -)
              git merge --abort 2>/dev/null || true
              echo "::error title=Push Merge Conflict::${CONFLICTS:-git merge origin/$UPDATE_BRANCH failed with no conflicted files}"
              exit 1
            fi
          done

          if [ "$PUSHED" != "true" ]; then
            echo "::error title=Push Failed::Could not push to $UPDATE_BRANCH after 5 attempts"
            exit 1
          fi

          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "commit_msg=$COMMIT_MSG" >> "$GITHUB_OUTPUT"

      - name: Read review items
        id: review
        run: |
          if [ -f ".github/enrichment_review.md" ]; then
            echo "has_review=true" >> $GITHUB_OUTPUT
            # Use delimiter for multiline output
            echo "review_content<<EOF" >> $GITHUB_OUTPUT
            cat .github/enrichment_review.md >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "has_review=false" >> $GITHUB_OUTPUT
          fi

      - name: Create or update PR
        if: steps.check_changes.outputs.changed == 'true' && inputs.dry_run != true
        uses: actions/github-script@v9
        env:
          UPDATE_BRANCH: ${{ env.UPDATE_BRANCH }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
          HAS_REVIEW: ${{ steps.review.outputs.has_review }}
          REVIEW_CONTENT: ${{ steps.review.outputs.review_content }}
        with:
          script: |
            const branch = process.env.UPDATE_BRANCH;
            const sha = process.env.COMMIT_SHA.substring(0, 7);
            const date = new Date().toISOString().split('T')[0];
            const hasReview = process.env.HAS_REVIEW === 'true';
            const reviewContent = process.env.REVIEW_CONTENT || '';

            // Check for existing PR from the update branch
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open'
            });

            // Use same table format as other workflows
            const entry = `| TBA Enrichment | [${sha}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${process.env.COMMIT_SHA}) | ${date} |`;

            if (prs.length > 0) {
              // Update existing PR - append to table
              const pr = prs[0];
              let body = pr.body || '';

              // Add entry before the END_UPDATES marker
              body = body.replace(/(<!-- END_UPDATES -->)/, `${entry}\n$1`);

              // Update or add review section
              if (hasReview && reviewContent) {
                const reviewMarker = '<!-- REVIEW_ITEMS -->';
                const reviewEndMarker = '<!-- END_REVIEW_ITEMS -->';
                const reviewSection = `${reviewMarker}\n${reviewContent}\n${reviewEndMarker}`;

                if (body.includes(reviewMarker)) {
                  // Replace existing review section
                  body = body.replace(
                    new RegExp(`${reviewMarker}[\\s\\S]*?${reviewEndMarker}`),
                    reviewSection
                  );
                } else {
                  // Add review section before END_UPDATES
                  body = body.replace(/(<!-- END_UPDATES -->)/, `\n${reviewSection}\n\n$1`);
                }
              }

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                body
              });

              console.log(`Updated PR #${pr.number}`);
              core.notice(`Updated PR #${pr.number} with TBA enrichment`);
            } else {
              // Create new PR with review items if present
              let prBody = `## Automated Conference Updates\n\n| Source | Commit | Date |\n|--------|--------|------|\n${entry}\n<!-- END_UPDATES -->`;

              if (hasReview && reviewContent) {
                prBody = `## Automated Conference Updates\n\n| Source | Commit | Date |\n|--------|--------|------|\n${entry}\n<!-- END_UPDATES -->\n\n<!-- REVIEW_ITEMS -->\n${reviewContent}\n<!-- END_REVIEW_ITEMS -->`;
              }

              const { data: newPr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Conference updates',
                head: branch,
                base: 'main',
                body: prBody
              });

              // Add labels
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: newPr.number,
                labels: ['automated', 'conference-update']
              });

              console.log(`Created PR #${newPr.number}`);
              core.notice(`Created PR #${newPr.number} for TBA enrichment`);
            }

      - name: Summary
        if: always()
        env:
          TBA_COUNT: ${{ steps.find-tba.outputs.tba_count }}
          CHANGED: ${{ steps.check_changes.outputs.changed }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Result" >> $GITHUB_STEP_SUMMARY

          if [ "$TBA_COUNT" = "0" ]; then
            echo "- Status: No TBA conferences to process" >> $GITHUB_STEP_SUMMARY
          elif [ "$CHANGED" = "true" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "- Status: Changes detected (dry run - not committed)" >> $GITHUB_STEP_SUMMARY
            else
              echo "- Status: Changes committed and PR updated" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- Status: No new links found" >> $GITHUB_STEP_SUMMARY
          fi

          echo "- TBA conferences scanned: $TBA_COUNT" >> $GITHUB_STEP_SUMMARY
