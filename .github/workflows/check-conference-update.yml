name: Check Conference Update

# A changedetection.io watch saw a conference page change. The change goes to
# the desk queue as it is: the desk checks it against the data and the live
# site on its next run, so nothing is filtered or edited here.
#
# conference-change comes from a watch on one conference's pages and queues a
# signal for that series. listing-change comes from a watch on a page that
# lists many events (pydata.org/upcoming-events, conference.scipy.org, the
# PSF PyCon trademark list), filtered to one event per line. Each added line
# is checked against the data in code (utils/desk_leads.py listing): a tracked
# edition is dropped, and the rest are queued as candidates, which the
# worklist routes to the new-year-checker or the scouter.

on:
  # Triggered by changedetection.io webhook
  repository_dispatch:
    types: [conference-change, listing-change]

  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      url:
        description: 'Conference website URL to check'
        required: true
        type: string
      conference_name:
        description: 'Conference name (e.g., "PyCon US 2027")'
        required: true
        type: string
      note:
        description: 'What to check, for the desk (optional)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build the queue record
        id: record
        env:
          RECORDS: ${{ runner.temp }}/desk-records.jsonl
        run: |
          # The payload is read from the event file, never interpolated into
          # the script: titles and diffs are text from conference websites.
          python3 << 'BUILD'
          import json
          import os
          import sys

          sys.path.insert(0, "utils")
          from desk_queue import clean_watch_title
          from desk_queue import resolve_watch_url

          event_name = os.environ["GITHUB_EVENT_NAME"]
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
              event = json.load(f)

          listing = False
          if event_name == "repository_dispatch":
              payload = event.get("client_payload") or {}
              url, title = payload.get("url"), payload.get("title")
              diff = payload.get("diff")
              watch_uuid = payload.get("watch_uuid") or None
              trigger = "website_change"
              listing = event.get("action") == "listing-change"
          else:
              inputs = event.get("inputs") or {}
              url, title = inputs.get("url"), inputs.get("conference_name")
              diff = inputs.get("note") or ""
              watch_uuid = None
              trigger = "manual"

          missing = [
              field for field, value in (("url", url), ("title", title))
              if not isinstance(value, str) or not value.strip()
          ]
          if missing:
              for field in missing:
                  print(f"::error title=Missing Field::{field} is required")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("## Payload Validation Failed\n\n")
                  summary.write(f"Missing required fields: {', '.join(missing)}\n\n")
                  summary.write("This usually means the changedetection.io token expired or the payload is malformed.\n")
              sys.exit(1)
          if not watch_uuid and event_name == "repository_dispatch":
              print("::warning title=Missing Field::client_payload.watch_uuid is missing")

          if diff is None:
              diff = ""
          elif not isinstance(diff, str):
              diff = json.dumps(diff, ensure_ascii=False)

          name, year = clean_watch_title(title)
          name = " ".join(name.split())  # one line, for the step output
          if listing:
              # One event per added line: the next step checks each against
              # the data. Files, not step outputs, carry the page's text.
              temp = os.environ["RUNNER_TEMP"]
              with open(f"{temp}/listing-lines.txt", "w", encoding="utf-8") as f:
                  f.write(diff if diff.endswith("\n") or not diff else diff + "\n")
              with open(f"{temp}/listing-url.txt", "w", encoding="utf-8") as f:
                  f.write(" ".join(resolve_watch_url(url.strip()).split()))
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write(f"series={name}\nlisting=true\n")
              print(f"Checking {len(diff.splitlines())} added line(s) from {name or title}")
              sys.exit(0)
          payload = {"diff": diff, "watch_uuid": watch_uuid, "trigger": trigger}
          if event_name == "workflow_dispatch":
              # The run id gives each manual request its own queue id, so
              # asking again with the same inputs is not taken as handled.
              payload["requested"] = os.environ["GITHUB_RUN_ID"]
          record = {
              "source": "changedetection",
              "kind": "signal",
              "title": title.strip(),
              # A watch that follows a series sends its URL with the year template in it
              "url": resolve_watch_url(url.strip()),
              "year": year,
              "payload": payload,
          }
          with open(os.environ["RECORDS"], "w", encoding="utf-8") as f:
              f.write(json.dumps(record, ensure_ascii=False) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"series={name}\n")
          print(f"Queueing a {trigger} signal for {name or title}")
          BUILD

      - name: Setup Pixi
        if: steps.record.outputs.listing == 'true'
        uses: prefix-dev/setup-pixi@v0.11.2

      # Each added line is one event. A line whose edition (or, without a
      # year, whose series) the data tracks is dropped; the rest become
      # candidates that the worklist routes like any other.
      - name: Check the listing lines against the data
        if: steps.record.outputs.listing == 'true'
        run: |
          pixi run python utils/desk_leads.py listing \
            --lines "$RUNNER_TEMP/listing-lines.txt" \
            --url "$(cat "$RUNNER_TEMP/listing-url.txt")" \
            --out "$RUNNER_TEMP/desk-records.jsonl"

      - name: Write to the desk queue
        id: queue
        uses: ./.github/actions/desk-queue-write
        with:
          records: ${{ runner.temp }}/desk-records.jsonl
          message: "Queue a changedetection signal for ${{ steps.record.outputs.series }}"

      - name: Summary
        env:
          SERIES: ${{ steps.record.outputs.series }}
          ADDED: ${{ steps.queue.outputs.added }}
        run: |
          echo "## Desk queue" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Series:** $SERIES" >> "$GITHUB_STEP_SUMMARY"
          if [ "$ADDED" = "0" ]; then
            echo "Already queued, nothing added." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Queued for the desk's next run." >> "$GITHUB_STEP_SUMMARY"
          fi
