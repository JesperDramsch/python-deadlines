name: Archive New Conference URLs

# Asks the Wayback Machine to save conference pages while they still show
# their edition, so the weekly archive resolve (archive-resolve.yml) has a
# capture to point old editions to once the site moves on. utils/archive_save.py
# decides what to save: URLs new since the last successful run, and the pages of
# editions at a save point (around the CfP deadline and the start). Both
# workflows talk to the archive through utils/wayback.py.

permissions:
  contents: read

on:
  push:
    branches: [ main, master]
    paths:
      - '_data/**'
  schedule:
    # Runs at 00:00 UTC on Saturday
    - cron: '0 0 * * 6'
  workflow_dispatch:
    inputs:
      skip_archive:
        description: 'Skip the Web Archive (only report the URLs). The run still counts as the last run, so its URLs are not saved later.'
        type: boolean
        default: false

concurrency:
  group: archive-new-urls
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history for the data at the last run

      - name: Find last successful run
        id: last-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN=$(gh run list --workflow="Archive New Conference URLs" --status success --limit 1 \
            --json headSha,createdAt --jq '.[0] // empty | "\(.headSha) \(.createdAt[:10])"')
          if [ -n "$RUN" ]; then
            echo "sha=${RUN% *}" >> "$GITHUB_OUTPUT"
            echo "since=${RUN#* }" >> "$GITHUB_OUTPUT"
          else
            # First run: every URL counts as new, and the last week's save points are due
            echo "sha=$(git rev-list --max-parents=0 HEAD)" >> "$GITHUB_OUTPUT"
            echo "since=$(date -u -d '7 days ago' +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --quiet requests pyyaml

      - name: Save to the Wayback Machine
        env:
          SHA: ${{ steps.last-run.outputs.sha }}
          SINCE: ${{ steps.last-run.outputs.since }}
          SKIP_ARCHIVE: ${{ inputs.skip_archive }}
        run: |
          git show "$SHA:_data/conferences.yml" > "$RUNNER_TEMP/previous.yml" 2>/dev/null || : > "$RUNNER_TEMP/previous.yml"
          ARGS=(--previous "$RUNNER_TEMP/previous.yml" --since "$SINCE" --summary "$GITHUB_STEP_SUMMARY")
          if [ "$SKIP_ARCHIVE" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python utils/archive_save.py "${ARGS[@]}"
